name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: API tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Bundle the Android app (catches broken imports)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/expo-export
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid
          EXPO_PUBLIC_SUPABASE_URL: https://example.invalid
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

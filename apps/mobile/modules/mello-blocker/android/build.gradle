plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.melloblocker'
version = '0.1.0'

android {
  namespace "expo.modules.melloblocker"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // GuardWatchWorker: periodic "your guard is off" reminders in self mode.
  implementation "androidx.work:work-runtime-ktx:2.10.0"
  implementation "androidx.core:core-ktx:1.13.1"
}
